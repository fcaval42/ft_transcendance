<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>TEST TEMPORAIRE - Pierre-Feuille-Ciseaux</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
  .banner {
    background: #ffcc00; color: #000; padding: 12px; text-align: center;
    font-weight: bold; border: 2px solid #cc0000; margin-bottom: 20px;
  }
  .player { border: 1px solid #ccc; padding: 15px; margin: 10px 0; border-radius: 8px; }
  button { margin: 4px; padding: 8px 16px; cursor: pointer; }
  pre { background: #f4f4f4; padding: 10px; overflow-x: auto; white-space: pre-wrap; }
  .last-round { border: 1px solid #999; background: #f9f9f9; padding: 12px; border-radius: 8px; line-height: 1.6; }
  .last-round .draw-banner { color: #cc0000; }
</style>
</head>
<body>
  <div class="banner">
    ⚠️ PAGE DE TEST TEMPORAIRE — pas la vraie interface, à supprimer plus tard ⚠️
  </div>

  <h1>Test manuel : Pierre-Feuille-Ciseaux</h1>

  <button id="createBtn">Créer une session (alice vs bob)</button>
  <button class="createBotBtn" data-difficulty="easy">Créer une session (alice vs 🤖 Bot easy)</button>
  <button class="createBotBtn" data-difficulty="medium">Créer une session (alice vs 🤖 Bot medium)</button>
  <button class="createBotBtn" data-difficulty="hard">Créer une session (alice vs 🤖 Bot hard)</button>
  <p>Session ID : <code id="sessionId">(aucune)</code></p>
  <h2>⏱️ Temps restant : <span id="timer">-</span>s</h2>

  <div class="player">
    <h3>Alice</h3>
    <button onclick="play('alice','rock')">🪨 Pierre</button>
    <button onclick="play('alice','paper')">📄 Feuille</button>
    <button onclick="play('alice','scissors')">✂️ Ciseaux</button>
  </div>

  <div class="player" id="player2Block">
    <h3 id="player2Name">Bob</h3>
    <button onclick="play('bob','rock')">🪨 Pierre</button>
    <button onclick="play('bob','paper')">📄 Feuille</button>
    <button onclick="play('bob','scissors')">✂️ Ciseaux</button>
  </div>

  <h3>🎮 Dernier coup joué :</h3>
  <div id="lastRound" class="last-round">-</div>

  <h3>État du match :</h3>
  <pre id="state">-</pre>

<script>
let sessionId = null;
let roundTimeLimitMs = null;
let roundDeadline = null; // timestamp (ms) auquel le round en cours se termine
let lastRoundsCount = 0;

document.getElementById('createBtn').onclick = () => startSession({ player1Id: 'alice', player2Id: 'bob' }, false);
document.querySelectorAll('.createBotBtn').forEach((btn) => {
  btn.onclick = () => startSession({ player1Id: 'alice', vsBot: true, botDifficulty: btn.dataset.difficulty }, true);
});

async function startSession(body, isVsBot) {
  const res = await fetch('/api/game/session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  sessionId = data.id;
  roundTimeLimitMs = data.roundTimeLimitMs;
  lastRoundsCount = 0;
  document.getElementById('sessionId').textContent = sessionId;
  document.getElementById('player2Name').textContent = isVsBot ? `🤖 Bot (${data.botDifficulty})` : 'Bob';
  document.getElementById('player2Block').style.display = isVsBot ? 'none' : 'block';
  startNewRoundTimer();
  render(data);
}

async function play(playerId, move) {
  if (!sessionId) { alert("Crée une session d'abord"); return; }
  const res = await fetch(`/api/game/session/${sessionId}/move`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ playerId, move })
  });
  const data = await res.json();
  const match = data.match ?? data;
  checkNewRound(match);
  render(match);
}

// Le chrono ne repart que quand on détecte qu'un nouveau round a commencé
// (le nombre de rounds joués a augmenté, qu'on l'ait déclenché nous-même
// en jouant, ou que ce soit le serveur qui ait résolu un timeout tout seul).
function checkNewRound(match) {
  if (match?.rounds && match.rounds.length !== lastRoundsCount) {
    lastRoundsCount = match.rounds.length;
    startNewRoundTimer();
  }
}

function startNewRoundTimer() {
  roundDeadline = Date.now() + roundTimeLimitMs;
}

const MOVE_LABELS = { rock: '🪨 Pierre', paper: '📄 Feuille', scissors: '✂️ Ciseaux' };

function formatMove(move) {
  return move ? MOVE_LABELS[move] : '🚫 AFK (pas de coup joué)';
}

function describeResult(result, player2Name) {
  switch (result) {
    case 'player1': return 'Alice gagne le round';
    case 'player2': return `${player2Name} gagne le round`;
    case 'draw': return 'Égalité';
    case 'afk': return 'Personne n\'a joué (AFK des deux côtés)';
    default: return result;
  }
}

function renderLastRound(match) {
  const el = document.getElementById('lastRound');
  if (!match?.rounds?.length) {
    el.textContent = '-';
    return;
  }
  const last = match.rounds[match.rounds.length - 1];
  const player2Name = document.getElementById('player2Name').textContent;

  let html = `<strong>Round ${last.roundNumber}</strong><br>`;
  html += `Alice a joué : ${formatMove(last.move1)}<br>`;
  html += `${player2Name} a joué : ${formatMove(last.move2)}<br>`;
  html += `Résultat : ${describeResult(last.result, player2Name)}`;

  if (match.status === 'finished' && match.winner === null) {
    html += `<br><span class="draw-banner"><strong>⚠️ Match nul — trop de rounds AFK d'affilée, match terminé.</strong></span>`;
  }

  el.innerHTML = html;
}

function render(data) {
  document.getElementById('state').textContent = JSON.stringify(data, null, 2);
  renderLastRound(data?.match ?? data);
}

// Rafraîchit l'état toutes les secondes, pour voir le timeout se déclencher
// tout seul côté serveur même si personne ne clique sur un bouton.
setInterval(async () => {
  if (!sessionId) return;
  const res = await fetch(`/api/game/session/${sessionId}`);
  if (res.ok) {
    const data = await res.json();
    checkNewRound(data.match);
    render(data);
  }
}, 1000);

// Affichage du chrono lui-même, rafraîchi plus souvent pour rester fluide.
// Approximatif (basé sur l'horloge du navigateur), suffisant pour du test manuel.
setInterval(() => {
  const timerEl = document.getElementById('timer');
  if (!roundDeadline) { timerEl.textContent = '-'; return; }
  const remainingMs = Math.max(0, roundDeadline - Date.now());
  timerEl.textContent = (remainingMs / 1000).toFixed(1);
}, 100);
</script>
</body>
</html>
