# POINTS À RETENIR
# 1. pas besoin de Dockerfile pour la base de données (mais bon cela t'importe peu)
# 2. Les données sont sauvegardées : grâce au volume postgres_data, rien n'est perdu
# quand on arrêtes le conteneur.
# 3. Port 5432: le port par défaut de PostgreSQL. Si tu as déjà PGRSQL installé en local,
# tu devras arrêter le Post local ou changer le port dans le docker-compose. (ex: 5433:5432)

# Commandes en plus:
# docker exec -it ft_transcendence_db psql -U postgres -d ft_transcendence :
#     Accéder à la base de données en ligne de commande
# docker-compose down -v  # Supprime le volume (ATTENTION : les données seront perdues !)
# docker-compose up -d    # Relance un conteneur propre
