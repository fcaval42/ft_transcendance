services:
  db:
    image: postgres:15
    container_name: ft_transcendance_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      FORTYTWO_REDIRECT_URI: ${FORTYTWO_REDIRECT_URI}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
    expose:
      - "3001"
    env_file:
      - .env

  frontend:
    build: ./frontend
    environment:
      WDS_SOCKET_PORT: 8443
    expose:
      - "3000"
  caddy:
      image: caddy:2-alpine
      ports:
        - "8080:80"
        - "8443:443"
      volumes:
        - ./Caddyfile:/etc/caddy/Caddyfile:z
        - caddy_data:/data
        - ./certs:/etc/caddy/certs:ro,z
        - caddy_config:/config
      depends_on:
        - frontend
        - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config: