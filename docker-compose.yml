services:
  db:
    image: postgres:15
    container_name: ft_transcendence_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432" # port pour se connecter depuis le backend
    volumes:
      - postgres_data:/var/lib/postgresql/data # sauvegarde les données même si
      # le conteneur s'arrête

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      FORTYTWO_REDIRECT_URI: https://localhost:8443/api/auth/42/callback
      GOOGLE_REDIRECT_URI: https://localhost:8443/api/auth/google/callback
    expose:
      - "3001"
    env_file:
      - .env

  frontend:
    build: ./frontend
    environment:
      WDS_SOCKET_PORT: 8443
    expose:
      - "3000"
  caddy:
      image: caddy:2-alpine
      ports:
        - "8080:80"
        - "8443:443"
      volumes:
        - ./Caddyfile:/etc/caddy/Caddyfile:z
        - caddy_data:/data
        - ./certs:/etc/caddy/certs:ro,z
        - caddy_config:/config
      depends_on:
        - frontend
        - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

# pour lancer : docker-compose up -d

# tu n'as pas besoin d'installer PostgreSQL sur ta machine (vive Docker). + tout
# le monde aura la même version de PostgreSQL.

# Quelques commandes de base utiles :
#| `docker-compose up -d` | Lance la base de données en arrière-plan. |
#| `docker ps` | Vérifie que le conteneur PostgreSQL est bien lancé. |
#| `docker-compose down` | Arrête la base de données (les données sont sauvegardées). |

# Pour les volumes : Docker crée automatiquement un dossier caché sur la machien pour
# stocker les données du volume. (ex : /var/lib/docker/volumes/... sur Linux/Mac).

# Plus tard quand il faudra se connecter depuis le backend (pas ta partie mais je le met
